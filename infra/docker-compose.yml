services:
  web:
    build:
      context: ..
      dockerfile: infra/web/Dockerfile
      args:
        API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "8091:80"
    depends_on:
      backend:
        condition: service_started

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lawyer
      POSTGRES_USER: lawyer
      POSTGRES_PASSWORD: "1642017"
    # لا ننشر 5432 على الهوست: الـ backend يتصل بـ db داخل الشبكة فقط،
    # ومنفذ 5432 غالبًا مستخدم على TrueNAS/Postgres آخر فيسبب تعارض Bind.
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://lawyer:1642017@db:5432/lawyer
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/data/uploads
    depends_on:
      db:
        condition: service_started

volumes:
  db_data:
  backend_uploads:

